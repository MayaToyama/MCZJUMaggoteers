skills:
  # ---- 原 affixes.yml 12 词缀迁移（trigger: spawn，出生时施加）----
  invisible:
    trigger: spawn
    invisible: true
  plastic:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: resistance, amp: 4, duration_ticks: 600 }
  cloaked:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: invisibility, amp: 0, duration_ticks: 600 }
  antifreeze:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: slowness, amp: 255, duration_ticks: 0 }
  mechanical:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: wither, amp: 255, duration_ticks: 0 }
  fireresistance:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: fire_resistance, amp: 255, duration_ticks: 0 }
  withering:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: wither, amp: 255, duration_ticks: 99999 }
  shield:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: absorption, amp: 9, duration_ticks: 99999 }
  exoskeleton:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: resistance, amp: 1, duration_ticks: 99999 }
  infected:
    trigger: spawn            # 纯装饰：无 effects
  blinding:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: blindness, amp: 0, duration_ticks: 999999 }
  eternal_curse:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: slowness, amp: 255, duration_ticks: 10 }

  # ---- IM 战斗技能迁移（waves.yml infernal.affixes 引用同名 id）----
  lifesteal:
    trigger: attack
    cooldown_sec: 1
    effects:
      - { effect: health, target: self, amount: 2 }
  weakness:
    trigger: attack
    cooldown_sec: 2
    effects:
      - { effect: potion, target: target, potion: weakness, amp: 0, duration_ticks: 100 }
  quicksand:
    trigger: damage_taken
    cooldown_sec: 2
    effects:
      - { effect: potion, target: target, potion: slowness, amp: 0, duration_ticks: 80 }
  poisonous:
    trigger: attack
    cooldown_sec: 3
    effects:
      - { effect: potion, target: target, potion: poison, amp: 0, duration_ticks: 100 }
  sprint:
    trigger: attack
    cooldown_sec: 4
    effects:
      - { effect: attribute, target: self, attr: movement_speed, op: multiply, value: 0.4, duration_ticks: 100 }
  berserk:
    trigger: damage_taken
    cooldown_sec: 5
    effects:
      - { effect: attribute, target: self, attr: attack_damage, op: multiply, value: 0.5, duration_ticks: 120 }
  archer:
    trigger: attack
    cooldown_sec: 6
    condition: { player_in_radius: 24 }
    effects:
      - { effect: summon, target: self, entity: arrow, count: 1, homing_target: nearest_player,
          projectile_speed: 1.6 }
  tosser:
    trigger: tick
    cooldown_sec: 7
    condition: { player_in_radius: 24 }
    effects:
      # IM RangeTosserSkill：范围内最近的非潜行玩家被水平拉向怪物（蹲下/创造/旁观豁免）
      - { effect: displace, target: player, radius: 24, force: 1.2, upward: 0.2 }
  storm:
    trigger: tick
    cooldown_sec: 8
    condition: { player_in_radius: 18 }
    effects:
      - { effect: health, target: area, radius: 6, damage: 6 }   # 风暴：目标区域伤害（等效闪电落点）
  molten:
    trigger: spawn
    effects:
      - { effect: potion, target: self, potion: fire_resistance, amp: 255, duration_ticks: 0 }
  necromancer:
    trigger: tick
    cooldown_sec: 9
    condition: { player_in_radius: 20 }
    effects:
      - { effect: summon, target: area, radius: 8, entity: zombie, count: 2 }
  ghastly:
    trigger: tick
    cooldown_sec: 10
    condition: { player_in_radius: 28 }
    effects:
      - { effect: summon, target: self, entity: fireball, count: 1, homing_target: nearest_player,
          projectile_speed: 1.2 }

  # ---- waves.yml 迁移后补齐的 6 个引用 id（原 infernal.affixes 同名）----
  confusing:
    trigger: attack
    cooldown_sec: 3
    effects:
      - { effect: potion, target: target, potion: nausea, amp: 0, duration_ticks: 100 }
  refrigerate:
    trigger: attack
    cooldown_sec: 4
    effects:
      - { effect: potion, target: target, potion: slowness, amp: 0, duration_ticks: 100 }
  swap:
    trigger: attack
    cooldown_sec: 8
    effects:
      - { effect: teleport, target: target, offset_y: 0 }
  vengeance:
    trigger: damage_taken
    cooldown_sec: 4
    effects:
      - { effect: health, target: target, damage: 4 }
  wardenwrath:
    trigger: tick
    cooldown_sec: 6
    condition: { player_in_radius: 16 }
    effects:
      - { effect: health, target: area, radius: 6, damage: 6 }
  1up:
    trigger: killed
    effects:
      - { effect: health, target: self, amount: 99999 }
