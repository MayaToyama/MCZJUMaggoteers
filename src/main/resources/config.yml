    world_create_failed: "<red>世界创建失败，对局终止。"
    plan_generating: "<gray>正在生成剧本…"
    plan_timeout: "<yellow>剧本生成超时(30s)，终止。"
    plan_failed: "<red>剧本生成失败{detail}，对局终止。"
