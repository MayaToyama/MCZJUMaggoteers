# 非券种物品（货币/职业券改由 config.yml items 段配置）
# ItemCreator 格式见 docs/ICReadme.md；PDC maggoteers:id 供 ItemInteractRouter 识别

maggoteers:revive_coin:
  material: TOTEM_OF_UNDYING
  customName: "<green>复活币"
  lore:
    - "<gray>对死者：拉回战场"
    - "<gray>对活者：+1 自动复活次数"
  glint: true
  pdc:
    - key: maggoteers:kind
      type: STRING
      value: revive_coin

maggoteers:supply_healing:
  material: GOLDEN_APPLE
  customName: "<red>应急口粮"
  lore:
    - "<gray>立即恢复 6 颗心"
  pdc:
    - key: maggoteers:kind
      type: STRING
      value: supply_healing

maggoteers:wooden_sword:
  material: WOODEN_SWORD
  customName: "<gray>训练木剑"
  lore:
    - "<dark_gray>开局配发"
  unbreakable: true

maggoteers:leather_helmet:
  material: LEATHER_HELMET
  customName: "<gray>训练皮帽"
  lore:
    - "<dark_gray>开局配发"
  unbreakable: true

maggoteers:shop_emerald:
  material: EMERALD
  customName: "<green>卫戍商店"
  lore:
    - "<gray>右键打开商店"
    - "<dark_gray>用卫戍币购买物资（不消耗）"
  glint: true
  pdc:
    - key: maggoteers:kind
      type: STRING
      value: shop_emerald

maggoteers:test_blade:
  material: IRON_SWORD
  customName: "<red>旋风斩"
  lore:
    - "<gray>右键：旋转剑气范围斩"
    - "<dark_gray>冷却 3 秒"
  enchantments:
    - minecraft:sharpness: 3
  unbreakable: true
  maxStackSize: 1
  useCooldown:
    cooldownGroup: "maggoteers:test_blade"
    seconds: 3
  pdc:
    - key: maggoteers:id
      type: STRING
      value: maggoteers:test_blade
  use_ability:
    cooldown_sec: 3
    effect: DAMAGE_AREA
    params:
      damage: 6.0
      radius: 6.0
      targets: enemies
      enemy_scope: tracked
    fx:
      preset: SPIRAL_RADIUS
      radius: 6.0
      particle: CRIT
      sound: ENTITY_PLAYER_ATTACK_SWEEP
      sound_volume: 0.9
      sound_pitch: 1.1
      density: 48
      spiral_ticks: 44

maggoteers:healing_staff:
  material: STICK
  itemModel: minecraft:diamond_spear
  customName: "<green>治疗法杖"
  lore:
    - "<gray>右键：5 格内队友 +3 心"
    - "<dark_gray>冷却 25 秒"
  glint: true
  unbreakable: true
  maxStackSize: 1
  useCooldown:
    cooldownGroup: "maggoteers:healing_staff"
    seconds: 25
  pdc:
    - key: maggoteers:id
      type: STRING
      value: maggoteers:healing_staff
  use_ability:
    cooldown_sec: 25
    effect: HEAL_AREA
    params:
      amount: 6.0
      radius: 5.0
      targets: allies
      include_self: true
    fx:
      preset: RIPPLE_RINGS
      radius: 5.0
      particle: HAPPY_VILLAGER
      ripple_rings: 4
      sound: BLOCK_BEACON_POWER_SELECT
      sound_volume: 1.0
      density: 56

maggoteers:excalibur:
  material: NETHERITE_SWORD
  customName: "<light_purple>Ex咖喱棒"
  lore:
    - "<gold>右键：准星方向圣剑光束"
    - "<dark_gray>冷却 10 秒"
  enchantments:
    - minecraft:sharpness: 5
  glint: true
  unbreakable: true
  maxStackSize: 1
  useCooldown:
    cooldownGroup: "maggoteers:excalibur"
    seconds: 10
  pdc:
    - key: maggoteers:id
      type: STRING
      value: maggoteers:excalibur
  use_ability:
    cooldown_sec: 10
    effect: DAMAGE_BEAM
    params:
      damage: 14.0
      ray_length: 32.0
      beam_radius: 1.25
      targets: enemies
      enemy_scope: tracked
    fx:
      preset: AIM_RAY
      particle: END_ROD
      ray_length: 32.0
      density: 64
      sound: ENTITY_LIGHTNING_BOLT_THUNDER
      sound_volume: 0.7
      sound_pitch: 1.15

# ── 怪物专用装备（waves.yml equipment 引用，不给玩家）────────────────
maggoteers:mob_iron_spear:
  material: IRON_SWORD
  itemModel: minecraft:iron_spear
  customName: "<gray>铁矛"
  unbreakable: true
  attributeModifiers:
    - attribute: minecraft:attack_damage
      amount: 6
      operation: ADD_NUMBER
      slot: mainhand

maggoteers:mob_gold_spear:
  material: GOLDEN_SWORD
  itemModel: minecraft:golden_spear
  customName: "<gold>金矛"
