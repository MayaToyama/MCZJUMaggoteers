maggoteers:revive_coin:
  material: TOTEM_OF_UNDYING
  customName: "<green>复活币"
  lore:
    - "<gray>右键消耗，选择一名玩家，为其添加1次复活机会，若玩家已死亡则将其复活"
    - "<dark_gray>"
  glint: true
  enchantments:
    - minecraft:unbreaking: 10
  pdc:
    - key: maggoteers:kind
      type: STRING
      value: revive_coin

maggoteers:supply_healing:
  material: GOLDEN_APPLE
  customName: "<red>应急口粮"
