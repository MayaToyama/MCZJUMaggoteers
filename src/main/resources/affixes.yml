# 词缀定义唯一处（铁律②）。缺省倍率=1.0（即不写=不影响）。display 用 MiniMessage。
# 战斗触发型 on: 词缀已退役；IM 技能请配置 waves.yml infernal: 块。
affixes:
  # 隐身用 LivingEntity#setInvisible，不用药水——苦力怕爆炸会把身上药水打成滞留云（dur 极大时玩家会被挂数小时隐身）
  invisible:
    display: "<gray>隐身"
  plastic:
    potions: [ { effect: RESISTANCE, amp: 4, dur: 600} ]
    display: "<blue>塑料"
  cloaked:
    potions: [ { effect: INVISIBILITY, amp: 0, dur: 600 } ]
    display: "<gray>隐匿"
  antifreeze:
    potions: [ { effect: SLOWNESS, amp: 255, dur: 0 } ]
    display: "<yellow>抗寒"
  mechanical:
    potions: [ { effect: WITHER, amp: 255, dur: 0 } ]
    display: "<yellow>机械制品"
  fireresistance:
    potions: [ { effect: FIRE_RESISTANCE, amp: 255, dur: 0 } ]
    display: "<yellow>抗火"
  withering:
    potions: [ { effect: WITHER, amp: 255, dur: 99999}]
    display: "<red>狂暴宿主"
  exoskeleton:
    potions: [ { effect: RESISTANCE, amp: 1, dur: 99999}]
    display: "<blue>外骨骼"
  infected:
    display: "<red>感染"
  blinding:
    potions: [ { effect: BLINDNESS, amp: 0, dur: 999999 } ]
    display: "<gray>致盲"
  eternal_curse:
    potions:
      - { effect: SLOWNESS, amp: 255, dur: 10 }
    display: "<dark_gray>永恒诅咒"

  greedy:  { drop: 1.5, display: "<gold>贪婪" }
  fortuned: { drop: 2.0, display: "<gold>鸿运" }
