# 词缀定义唯一处（铁律②）。缺省倍率=1.0（即不写=不影响）。display 用 MiniMessage。
affixes:
  armored: { hp: 2.0, display: "<aqua>装甲" }
  berserk: { dmg: 1.5, speed: 1.2, display: "<red>狂暴" }
  toxic:
    potions: [ {effect: POISON, amp: 1, dur: 200} ]
    on: hit-player
    display: "<green>毒素"
  greedy:  { drop: 1.5, display: "<gold>贪婪" }
  swift:   { speed: 1.3, display: "<blue>迅捷" }
  tank:    { hp: 3.0, dmg: 0.8, display: "<dark_aqua>重甲" }
  vampiric:
    potions: [ {effect: REGENERATION, amp: 1, dur: 200} ]
    on: hit-player
    display: "<dark_red>嗜血"
  fortuned: { drop: 2.0, display: "<gold>鸿运" }
