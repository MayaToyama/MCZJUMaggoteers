# waveplan implementation (2026-07-26). Single source for strategies and pools.
# delay = step pre-wait seconds; coeff may include hp/dmg/speed/scale/follow_range
# Optional IM affixes (steps / passengers / on_death, independent, no inheritance):
# infernal:
#   level: 1
#   affixes: [poisonous, sprint]
# Disabled IM skills: morph, mama, mounted, vexsummoner, ghost
# IM missing/unknown/disabled skills: warning once, entity stays vanilla.
pools:
  act1:
    weak:
      - { strategy: w1_bug_buddies, weight: 2 }
      - { strategy: w1_patrol_riders, weight: 2 }
      - { strategy: w1_accident, weight: 2 }
      - { strategy: w1_symbiosis, weight: 2 }
      - { strategy: w1_symptom, weight: 2 }
      - { strategy: w1_herd, weight: 2 }
    strong:
      - { strategy: s1_resort_ghosts, weight: 2 }
      - { strategy: s1_low_altitude, weight: 2 }
      - { strategy: s1_vent_breeze, weight: 2 }
    boss:
      - { strategy: b1_colossus, weight: 2 }
      - { strategy: b1_eternal_rest, weight: 2 }
      - { strategy: b1_bandit_chief, weight: 2 }
  act2:
    weak:
      - { strategy: w2_merchant_convoy, weight: 2 }
      - { strategy: w2_endless_spear, weight: 2 }
      - { strategy: w2_fireworks, weight: 2 }
      - { strategy: w2_lord_legacy, weight: 2 }
      - { strategy: w2_nest, weight: 2 }
      - { strategy: w2_territory, weight: 2 }
    strong:
      - { strategy: s2_ice_shadows, weight: 2 }
      - { strategy: s2_migration, weight: 2 }
      - { strategy: s2_forbidden, weight: 2 }
      - { strategy: s2_chessboard, weight: 2 }
      - { strategy: s2_crimson_tunnel, weight: 2 }
      - { strategy: s2_controversy, weight: 2 }
    boss:
      - { strategy: b2_silent_guard, weight: 2 }
      - { strategy: b2_breath, weight: 2 }
      - { strategy: b2_frost_farewell, weight: 2 }
  act3:
    weak:
      - { strategy: w3_duck_ops, weight: 2 }
      - { strategy: w3_rabbit_holes, weight: 2 }
      - { strategy: w3_lights_out, weight: 2 }
    strong:
      - { strategy: s3_surprise_factory, weight: 2 }
      - { strategy: s3_across_fire, weight: 2 }
      - { strategy: s3_out_of_control, weight: 2 }
      - { strategy: s3_chaos_facade, weight: 2 }
      - { strategy: s3_keep_out, weight: 2 }
      - { strategy: s3_fire_water, weight: 2 }
      - { strategy: s3_institution, weight: 2 }
      - { strategy: s3_witch_pact, weight: 2 }
      - { strategy: s3_rhine_guard, weight: 2 }
    boss:
      - { strategy: b3_into_eternal, weight: 2 }
      - { strategy: b3_sentinel, weight: 2 }
      - { strategy: b3_human_radiance, weight: 2 }

strategies:
  # 与虫为伴（w1_bug_buddies）
  w1_bug_buddies:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "1", type: SPIDER, count: 4, delay: 0 }
      - { point: "1", type: ENDERMITE, count: 6, delay: 2 }
      - { point: "2", type: SPIDER, count: 4, delay: 0 }
      - { point: "2", type: CAVE_SPIDER, count: 6, delay: 2 }
      - { point: "5", type: SKELETON, count: 3, affixes: [plastic], delay: 1 }

  # 巡逻队（w1_patrol_riders）
  w1_patrol_riders:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - point: "1"
        type: SPIDER
        count: 2
        delay: 0
        coeff: { speed: 1.5 }
        passengers:
          - { type: SKELETON, count: 1 }
      - point: "3"
        type: SPIDER
        count: 2
        delay: 10
        coeff: { speed: 1.5 }
        passengers:
          - { type: SKELETON, count: 1 }

  # 意外（w1_accident）
  w1_accident:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "1", type: SKELETON, coeff: { hp: 0.4 }, count: 5, delay: 0 }
      - { point: "2", type: SKELETON, coeff: { hp: 0.4 }, count: 1, delay: 8 }
      - { point: "2", type: SKELETON, coeff: { hp: 0.4 }, count: 4, delay: 16 }
      - { point: "5", type: SKELETON, coeff: { hp: 0.4 }, count: 1, delay: 8 }
      - { point: "5", type: SKELETON, coeff: { hp: 0.4 }, count: 4, delay: 24 }

  # 共生（w1_symbiosis）
  w1_symbiosis:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "3", type: ENDERMITE, count: 10, delay: 0 }
      - { point: "4", type: ENDERMITE, count: 10, delay: 2 }
      - { point: boss, type: VINDICATOR, count: 3, coeff: { hp: 0.6 }, infernal: { level: 1, affixes: [lifesteal] }, delay: 0 }

  # 病症（w1_symptom）
  w1_symptom:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "1", type: ZOMBIE, count: 2, delay: 0, affixes: [infected], on_death: [ { type: ENDERMITE, count: 3 } ] }
      - { point: "2", type: ZOMBIE, count: 2, delay: 2, affixes: [infected], on_death: [ { type: ENDERMITE, count: 3 } ] }
      - point: "3"
        type: SLIME
        count: 4
        affixes: [infected]
        infernal:
          level: 1
          affixes: [quicksand]
        delay: 0
        on_death:
          - { type: ENDERMITE, count: 3 }
      - point: "4"
        type: SLIME
        count: 4
        affixes: [infected]
        infernal:
          level: 1
          affixes: [quicksand]
        delay: 4
        on_death:
          - { type: ENDERMITE, count: 3 }

  # 从众效应（w1_herd）
  w1_herd:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "1", type: ZOMBIE, count: 8, coeff: { scale: 0.8, speed: 1.2, hp: 0.5 },delay: 0 }
      - { point: "2", type: ZOMBIE, count: 8, coeff: { scale: 0.8, speed: 1.2, hp: 0.5 },delay: 4 }
      - { point: "3", type: ZOMBIE, count: 8, coeff: { scale: 0.8, speed: 1.2, hp: 0.5 },delay: 8 }
      - { point: "4", type: ZOMBIE, count: 8, coeff: { scale: 0.8, speed: 1.2, hp: 0.5 },delay: 12 }
      - { point: "5", type: ZOMBIE, count: 8, coeff: { scale: 0.8, speed: 1.2, hp: 0.5 }, delay: 16 }

  # 度假村冤魂（s1_resort_ghosts）
  s1_resort_ghosts:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 4 } ]
    steps:
      - point: "1"
        type: ZOMBIE
        count: 4
        coeff: { hp: 0.5, speed: 1.5 }
        delay: 0
        equipment:
          - { slot: HAND, item: maggoteers:mob_iron_spear }
      - point: "2"
        type: ZOMBIE
        count: 4
        coeff: { hp: 0.5, speed: 1.5 }
        delay: 5
        equipment:
          - { slot: HAND, item: maggoteers:mob_iron_spear }
      - point: "3"
        type: ZOMBIFIED_PIGLIN
        count: 2 
        delay: 1
        equipment:
          - { slot: HAND, item: maggoteers:mob_gold_spear }
        infernal:
          level: 1
          affixes: [archer]

  # 低空机动（s1_low_altitude）
  s1_low_altitude:
    repeat: 1
    clearReward: [ { item: maggoteers:currency_normal, amount: 4 } ]
    steps:
      - point: "1"
        type: STRIDER
        count: 2
        coeff: { speed: 3.0 }
        delay: 0
        passengers:
          - type: STRIDER
            count: 1
            passengers:
              - type: ZOMBIE
                count: 1
                coeff: { dmg: 2.0 }
                equipment:
                  - { slot: HAND, item: maggoteers:mob_gold_spear }
      - point: "2"
        type: STRIDER
        count: 2
        coeff: { speed: 3.0 }
        delay: 10
        passengers:
          - type: STRIDER
            count: 1
            passengers:
              - type: ZOMBIE
                count: 1
                coeff: { dmg: 2.0 }
                equipment:
                  - { slot: HAND, item: maggoteers:mob_gold_spear }
      - point: "5"
        type: STRIDER
        count: 2
        coeff: { speed: 3.0 }
        delay: 10
        passengers:
          - type: STRIDER
            count: 1
            passengers:
              - type: SKELETON
                count: 1
                coeff: { dmg: 2.0 }
                equipment:
                  - { slot: HAND, item: maggoteers:mob_bow }

  # 排风口（s1_vent_breeze）
  s1_vent_breeze:
