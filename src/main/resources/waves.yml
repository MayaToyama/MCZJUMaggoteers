      - { point: "3", type: BOGGED, count: 4, affixes: [cloaked], delay: 10 }
      - { point: "4", type: BOGGED, count: 4, affixes: [cloaked], delay: 10 }

  # 拆东补西（w1_jungle_spider_swap）
