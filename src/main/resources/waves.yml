    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "1", type: CAVE_SPIDER, coeff: { hp:0.1 }, count: 1, delay: 1 }
      - { point: "2", type: CAVE_SPIDER, coeff: { hp:0.1 }, count: 1, delay: 1 }
      - { point: "3", type: CAVE_SPIDER, coeff: { hp:0.1 }, count: 1, delay: 1 }
      - { point: "4", type: CAVE_SPIDER, coeff: { hp:0.1 }, count: 1, delay: 1 }

