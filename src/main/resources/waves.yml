              - { slot: HAND, item: maggoteers:mob_iron_spear }
          - type: SKELETON
            count: 1
            equipment:
              - { slot: HAND, item: maggoteers:mob_bow_power1 }
      - point: "2"
        type: CAMEL_HUSK
        count: 1
        coeff: { speed: 4.0 }
        delay: 0
        passengers:
          - type: ZOMBIE
            count: 1
            affixes: [plastic]
            equipment:
              - { slot: HEAD, item: maggoteers:mob_iron_helmet_ub10 }
              - { slot: HAND, item: maggoteers:mob_iron_spear }
          - type: SKELETON
            count: 1
            equipment:
              - { slot: HAND, item: maggoteers:mob_bow_power1 }
      - point: "3"
        type: CAMEL_HUSK
        count: 1
        coeff: { speed: 4.0 }
        delay: 0
        passengers:
          - type: ZOMBIE
            count: 1
            affixes: [plastic]
            equipment:
              - { slot: HEAD, item: maggoteers:mob_iron_helmet_ub10 }
              - { slot: HAND, item: maggoteers:mob_iron_spear }
          - type: SKELETON
            count: 1
            equipment:
              - { slot: HAND, item: maggoteers:mob_bow_power1 }
      - point: "4"
        type: CAMEL_HUSK
        count: 1
        coeff: { speed: 4.0 }
        delay: 0
        passengers:
          - type: ZOMBIE
            count: 1
            affixes: [plastic]
            equipment:
              - { slot: HEAD, item: maggoteers:mob_iron_helmet_ub10 }
              - { slot: HAND, item: maggoteers:mob_iron_spear }
          - type: SKELETON
            count: 1
            equipment:
              - { slot: HAND, item: maggoteers:mob_bow_power1 }

  # 死囚之夜（w1_desert_prisoners）
