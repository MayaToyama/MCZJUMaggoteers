  # 公害（w1_desert_plague）
  w1_desert_plague:
    clearReward: [ { item: maggoteers:currency_normal, amount: 2 } ]
    steps:
      - { point: "1", type: CREEPER, count: 3, coeff: { scale: 0.7, speed: 1.5 }, delay: 0 }
      - { point: "2", type: CREEPER, count: 3, coeff: { scale: 0.7, speed: 1.5 }, delay: 5 }
