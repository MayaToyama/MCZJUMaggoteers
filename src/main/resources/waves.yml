          - type: STRIDER
            count: 1
            passengers:
              - { type: PILLAGER, count: 1 }
      - point: "2"
        type: STRIDER
        count: 5
        coeff: { speed: 4.0 }
        delay: 5
        passengers:
          - type: STRIDER
            count: 1
            passengers:
              - { type: PILLAGER, count: 1 }
      - point: "5"
        type: STRIDER
        count: 2
        coeff: { speed: 4.0 }
        delay: 10
        passengers:
          - type: STRIDER
            count: 1
            passengers:
              - { type: VINDICATOR, count: 1 }
      - point: boss
        type: STRIDER
        count: 1
        coeff: { hp: 5.0, speed: 4.0 }
        delay: 5
        passengers:
