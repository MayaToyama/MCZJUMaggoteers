name: Maggoteers
version: '${project.version}'
main: io.mczju.maggoteers.MaggoteersPlugin
api-version: '26.2'
depend: [MCZJUGameCore]
softdepend: [MCZJUItemCreator, InfernalMobs]
commands:
  maggoteers:
    description: 卫戍协议命令（shop 等）
    usage: /maggoteers shop
    permission: maggoteers.play
permissions:
  maggoteers.play:
    description: 加入对局与打开商店
    default: true
  maggoteers.admin:
    description: 使用 /maggoteers debug（正式服）；内部测试可用 config debug.enabled
    default: op
