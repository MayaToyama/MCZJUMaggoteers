name: Maggoteers
version: '${project.version}'
main: io.mczju.maggoteers.MaggoteersPlugin
api-version: '1.21.7'
depend: [MCZJUGameCore]
softdepend: [MCZJUItemCreator]
commands:
  maggoteers:
    description: 卫戍协议命令（shop 等）
    usage: /maggoteers shop
    permission: maggoteers.play
permissions:
  maggoteers.play:
    default: true
  maggoteers.admin:
    default: op
